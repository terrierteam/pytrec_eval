# This workflow will install Python dependencies, and runs tests with a variety of Python versions
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Continuous Integration

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    
    strategy:
      matrix:
        python-version: ['3.9', '3.14', '3.15']
        os: ['ubuntu-latest', 'windows-latest', 'macOs-latest']
        include:
          - { os: windows-11-arm, python-version: '3.11', architecture: arm64 }
          - { os: windows-11-arm, python-version: '3.14', architecture: arm64 }
          - { os: windows-11-arm, python-version: '3.15', architecture: arm64 }

    runs-on: ${{ matrix.os }}
    steps:

    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        architecture: ${{ matrix.architecture }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install --timeout=120 . --group test
        
    - name: Test-unix with pytest
      if: runner.os != 'Windows'
      run: |
        pytest tests/*.py

    - name: Test-windows with pytest
      if: runner.os == 'Windows'
      shell: cmd
      run: |
        pytest tests\pytrec_eval_tests.py
